<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTrainer Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #15181d; --muted: #5d6673; --line: #dfe3e8;
  --accent: #2563eb; --good: #15803d; --bad: #b91c1c; --live: #dc2626; --chip: #eef1f5;
  --stage: #0f1419; --stage-grid: #1d252e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --panel: #161b22; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a313b;
    --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --live: #f87171; --chip: #202733;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0; font-size: 20px; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
nav button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.matches .card { cursor: pointer; margin-bottom: 8px; }
.matches .card:hover { border-color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
.live { background: var(--live); color: #fff; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; }
.up { color: var(--good); } .down { color: var(--bad); }
.table-wrap { overflow-x: auto; }
select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
canvas { width: 100%; height: auto; display: block; background: var(--stage); border-radius: 8px; }
.player { display: flex; gap: 10px; align-items: center; }
code { background: var(--chip); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
ol, ul { padding-left: 20px; margin: 6px 0; }
h2 { font-size: 17px; margin: 18px 0 8px; }
h3 { font-size: 15px; margin: 0 0 4px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
input[type=range] { width: 100%; }
svg.spark { width: 120px; height: 28px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>GameTrainer</h1>
  <p id="sub">Match history and stats from data points, served by your host device.</p>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <nav role="tablist">
    <button data-tab="matches" aria-selected="true">Matches</button>
    <button data-tab="career">Career</button>
    <button data-tab="games">Games</button>
    <button data-tab="consoles">Consoles</button>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async path => { const r = await fetch(path); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); };
const rgb = bgr => bgr ? `rgb(${Math.round(bgr[2])},${Math.round(bgr[1])},${Math.round(bgr[0])})` : "#888";
const fmtDur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const fmtDate = t => t ? new Date(t * 1000).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "-";
const STATS = [
  ["on_screen_pct", "On screen", "%"], ["avg_speed_px_s", "Avg speed", " px/s"], ["top_speed_px_s", "Top speed", " px/s"],
  ["moving_pct", "Moving", "%"], ["screen_coverage_pct", "Coverage", "%"],
  ["avg_opponent_distance_px", "Opp. distance", " px"], ["close_quarters_pct", "Close quarters", "%"],
];
const fmtStat = (v, unit) => v === null || v === undefined ? "-" : `${Math.round(v)}${unit}`;
let state = { tab: "matches", game: "", session: null, timer: null, player: null };

async function loadTiles() {
  try {
    const o = await api("/api/overview");
    const live = o.live.length ? `<span class="chip live">LIVE</span>` : "";
    $("#tiles").innerHTML = `
      <div class="tile"><b>${o.matches}</b><span>matches tracked</span></div>
      <div class="tile"><b>${fmtDur(o.seconds_tracked)}</b><span>time tracked</span></div>
      <div class="tile"><b>${Object.keys(o.games).length}</b><span>games played</span></div>
      <div class="tile"><b>${o.live.length || "none"} ${live}</b><span>being tracked now</span></div>`;
  } catch (e) { $("#tiles").innerHTML = `<div class="tile"><b>offline</b><span>${esc(e.message)}</span></div>`; }
}

// ------------------------------------------------------------------ matches
async function showMatches() {
  const [{sessions}, ov] = await Promise.all([api("/api/sessions" + (state.game ? "?game=" + encodeURIComponent(state.game) : "")), api("/api/overview")]);
  const opts = Object.keys(ov.games).map(g => `<option ${g === state.game ? "selected" : ""}>${esc(g)}</option>`).join("");
  let html = `<div class="row" style="margin-bottom:12px"><label class="small muted" for="gf">Game</label>
    <select id="gf"><option value="">All games</option>${opts}</select></div><div class="matches">`;
  if (!sessions.length) html += `<div class="empty">No matches yet. Track one on the host:<br><code>gametrainer smash --build-replay</code><br>or try <code>gametrainer smash --synthetic</code></div>`;
  for (const s of sessions) {
    html += `<div class="card" data-sid="${esc(s.session_id)}"><div class="row">
      <b>${esc(s.game || "Unknown game")}</b>${s.live ? '<span class="chip live">LIVE</span>' : ""}
      <span class="chip">${esc(s.console || "console?")}</span>
      <span class="muted small" style="margin-left:auto">${fmtDate(s.start)} · ${fmtDur(s.duration)} · ${s.frame_count} frames</span></div></div>`;
  }
  $("#view").innerHTML = html + "</div>";
  $("#gf").onchange = e => { state.game = e.target.value; render(); };
  for (const c of document.querySelectorAll("[data-sid]")) c.onclick = () => { state.session = c.dataset.sid; render(); };
}

function delta(v, unit) {
  if (v === undefined || v === null || Math.abs(v) < 0.5) return `<span class="muted small">±0</span>`;
  return `<span class="small ${v > 0 ? "up" : "down"}">${v > 0 ? "▲" : "▼"} ${Math.abs(Math.round(v))}${unit.trim() === "%" ? " pts" : ""}</span>`;
}

async function showMatch(sid) {
  const m = await api("/api/sessions/" + encodeURIComponent(sid));
  const pids = Object.keys(m.players);
  const hud = Object.entries(m.final_hud || {}).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(v)}</span>`).join(" ");
  let rows = "";
  for (const [key, label, unit] of STATS) {
    rows += `<tr><th>${label}</th>` + pids.map(p => `<td class="num">${fmtStat(m.players[p].stats[key], unit)} ${m.players[p].career_matches > 1 ? delta(m.players[p].vs_average[key], unit) : ""}</td>`).join("") + "</tr>";
  }
  const heads = pids.map(p => { const pl = m.players[p];
    return `<th class="num"><span class="sw" style="background:${rgb(pl.color_bgr)}"></span> ${esc(p)}<div class="small muted" style="text-transform:none">${esc(pl.car || pl.skin || "")}</div></th>`; }).join("");
  const events = (m.events || []).slice(0, 60).map(e => `<li><span class="muted">${(e.t ?? 0).toFixed(1)}s</span> ${esc(e.type)} ${esc(e.zone || e.action || "")} ${e.from !== undefined ? esc(e.from) + " → " + esc(e.to) : ""}</li>`).join("");
  $("#view").innerHTML = `
    <div class="row"><button class="btn" id="back">← Matches</button>
      <h2 style="margin:0">${esc(m.game || "Unknown game")}</h2>${m.live ? '<span class="chip live">LIVE</span>' : ""}</div>
    <p class="muted small">${fmtDate(m.start)} · ${fmtDur(m.duration_seconds)} · ${m.frames} frames · ${esc(m.console || "")} · session <code>${esc(m.session_id)}</code></p>
    ${hud ? `<p>${hud}</p>` : ""}
    <div class="card"><h3>Replay from data points</h3>
      <canvas id="stage" width="1280" height="720"></canvas>
      <div class="row" style="margin-top:8px"><button class="btn" id="play">Play</button>
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <span class="small muted" id="clock">0.0s</span></div>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Replay position"></div>
    <h2>Scoreboard</h2>
    <div class="card table-wrap"><table><thead><tr><th></th>${heads}</tr></thead><tbody>${rows}</tbody></table>
      <p class="small muted">▲/▼ = this match compared with that player's average in ${esc(m.game || "this game")}. Speeds and distances are screen pixels, so compare within one game.</p></div>
    ${events ? `<h2>Events</h2><div class="card"><ul class="small">${events}</ul></div>` : ""}`;
  $("#back").onclick = () => { state.session = null; render(); };
  startReplay(sid, m.live);
}

// Browser replay viewer: positions only, drawn with each player's measured color.
let viewer = null;
async function startReplay(sid, live) {
  if (viewer) cancelAnimationFrame(viewer.raf);
  const r = await api(`/api/sessions/${encodeURIComponent(sid)}/replay`);
  const cv = $("#stage"); if (!cv) return;
  const [fw, fh] = r.frame_size && r.frame_size[0] ? r.frame_size : [1280, 720];
  cv.width = fw; cv.height = fh;
  const ctx = cv.getContext("2d"), tl = r.timeline || [], dur = r.duration_seconds || 0;
  const color = pid => rgb((r.players[pid] || {}).color_bgr);
  viewer = { t: live ? dur : 0, playing: false, speed: 1, last: performance.now(), raf: 0 };
  const idxAt = t => { let lo = 0, hi = tl.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (tl[mid].t <= t) lo = mid; else hi = mid - 1; } return lo; };
  const draw = () => {
    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue("--stage"); ctx.fillRect(0, 0, fw, fh);
    ctx.strokeStyle = css.getPropertyValue("--stage-grid"); ctx.lineWidth = 1;
    for (let x = 0; x <= fw; x += fw / 8) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, fh); ctx.stroke(); }
    for (let y = 0; y <= fh; y += fh / 6) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(fw, y); ctx.stroke(); }
    if (!tl.length) return;
    const i = idxAt(viewer.t), from = idxAt(viewer.t - 2);
    const trails = {};
    for (let k = from; k <= i; k++) for (const e of tl[k].entities || []) if (e.x != null) (trails[e.player_id || e.entity] ||= []).push(e);
    for (const [pid, pts] of Object.entries(trails)) {
      ctx.strokeStyle = color(pid); ctx.globalAlpha = 0.5; ctx.lineWidth = 4; ctx.beginPath();
      pts.forEach((p, n) => n ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (const e of tl[i].entities || []) {
      if (e.x == null) continue;
      const pid = e.player_id || e.entity;
      ctx.fillStyle = color(pid); ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(10, fw / 70), 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = `${Math.round(fw / 50)}px system-ui`;
      const label = `${pid} ${e.car || e.skin || ""}`, lw = ctx.measureText(label).width;
      ctx.fillText(label, e.x + fw / 55 + lw > fw ? e.x - fw / 55 - lw : e.x + fw / 55, Math.max(fw / 40, e.y - fw / 70));
    }
    ctx.fillStyle = "#cbd5e1"; ctx.font = `${Math.round(fw / 55)}px system-ui`;
    (tl[i].hud || []).forEach((h, n) => ctx.fillText(`${h.zone}: ${h.value ?? "-"}`, 14, 30 + n * fw / 45));
    $("#clock").textContent = `${viewer.t.toFixed(1)}s / ${dur.toFixed(1)}s`;
    $("#scrub").value = dur ? Math.round(viewer.t / dur * 1000) : 0;
  };
  const tick = now => {
    const dt = (now - viewer.last) / 1000; viewer.last = now;
    if (viewer.playing) { viewer.t = Math.min(dur, viewer.t + dt * viewer.speed); if (viewer.t >= dur) { viewer.playing = false; $("#play").textContent = "Play"; } }
    draw(); viewer.raf = requestAnimationFrame(tick);
  };
  $("#play").onclick = () => { if (viewer.t >= dur) viewer.t = 0; viewer.playing = !viewer.playing; $("#play").textContent = viewer.playing ? "Pause" : "Play"; };
  $("#speed").onchange = e => viewer.speed = +e.target.value;
  $("#scrub").oninput = e => { viewer.t = dur * e.target.value / 1000; };
  viewer.raf = requestAnimationFrame(tick);
}

// ------------------------------------------------------------------- career
function spark(points, key) {
  const vals = points.map(p => p[key]).filter(v => typeof v === "number");
  if (vals.length < 2) return `<span class="muted small">${vals.length ? "1 match" : "-"}</span>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const d = vals.map((v, i) => `${i ? "L" : "M"}${(i / (vals.length - 1) * 116 + 2).toFixed(1)},${(26 - (v - lo) / span * 24).toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 120 28" role="img" aria-label="trend"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
}

async function showCareer() {
  const {players} = await api("/api/career");
  if (!players.length) { $("#view").innerHTML = `<div class="empty">Career stats appear after your first finished match.</div>`; return; }
  const byGame = {};
  for (const p of players) (byGame[p.game] ||= []).push(p);
  let html = `<p class="small muted">Averages over every finished match, per game and player slot. Trend = average speed per match, oldest to newest.</p>`;
  for (const [game, ps] of Object.entries(byGame)) {
    html += `<h2>${esc(game)}</h2><div class="card table-wrap"><table><thead><tr><th>Player</th><th class="num">Matches</th><th class="num">Time</th>
      ${STATS.map(([, l]) => `<th class="num">${l}</th>`).join("")}<th>Trend</th></tr></thead><tbody>`;
    for (const p of ps) html += `<tr><td><b>${esc(p.player_id)}</b> <span class="muted small">${esc(p.usual_look || "")}</span></td>
      <td class="num">${p.matches}</td><td class="num">${fmtDur(p.seconds)}</td>
      ${STATS.map(([k, , u]) => `<td class="num">${fmtStat(p.averages[k], u)}</td>`).join("")}<td>${spark(p.trend, "avg_speed_px_s")}</td></tr>`;
    html += `</tbody></table></div>`;
  }
  $("#view").innerHTML = html;
}

// ------------------------------------------------------------ games/consoles
async function showGames() {
  const {games} = await api("/api/games");
  $("#view").innerHTML = `<p class="small muted">Any other game: <code>gametrainer --new-game "Name" --kind fighter|racer|shooter|any</code></p><div class="grid">` +
    games.map(g => `<div class="card"><h3>${esc(g.name)}</h3>
      <div class="row small"><span class="chip">${esc(g.console)}</span>${g.kind ? `<span class="chip">${esc(g.kind)}</span>` : ""}<span class="chip">${g.players.length} tracked</span></div>
      <p class="small">${esc(g.description)}</p>
      <p class="small">Track: <code>gametrainer ${esc(g.aliases[0] || g.profile)} --build-replay</code></p>
      ${g.hud.length ? `<p class="small muted">HUD: ${g.hud.map(esc).join(", ")}</p>` : ""}</div>`).join("") + "</div>";
}

async function showConsoles() {
  const {consoles} = await api("/api/consoles");
  $("#view").innerHTML = `<p class="small muted">Any console with a video output works through an HDMI capture card. Wiring for one console: <code>gametrainer --wiring ps5</code></p><div class="grid">` +
    consoles.map(c => `<div class="card"><h3>${esc(c.name)}</h3>
      ${c.short_names.length ? `<p class="small muted">${c.short_names.map(s => `<code>${esc(s)}</code>`).join(" ")}</p>` : ""}
      <ol class="small">${c.chain.slice(0, 2).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <ul class="small">${c.steps.map(s => `<li>${esc(s)}</li>`).join("")}<li><b>HDCP:</b> ${esc(c.hdcp)}</li><li><b>Output:</b> ${esc(c.output)}</li></ul></div>`).join("") + "</div>";
}

// ------------------------------------------------------------------- router
async function render() {
  clearInterval(state.timer);
  if (viewer) { cancelAnimationFrame(viewer.raf); viewer = null; }
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.tab === state.tab);
  try {
    if (state.tab === "matches" && state.session) await showMatch(state.session);
    else if (state.tab === "matches") await showMatches();
    else if (state.tab === "career") await showCareer();
    else if (state.tab === "games") await showGames();
    else await showConsoles();
  } catch (e) { $("#view").innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; }
  // Keep the match list and any live match fresh while tracking runs on the host.
  if (state.tab === "matches") state.timer = setInterval(async () => {
    await loadTiles();
    if (!state.session) showMatches().catch(() => {});
    else if ($(".chip.live", $("#view")) && !(viewer && viewer.playing)) showMatch(state.session).catch(() => {});
  }, state.session ? 5000 : 10000);
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => { state.tab = b.dataset.tab; state.session = null; render(); };
api("/api/health").then(h => { $("#sub").textContent = `GameTrainer ${h.version} · read-only dashboard served by your host device · data points, not video`; }).catch(() => {});
loadTiles(); render();
</script>
</body>
</html>
